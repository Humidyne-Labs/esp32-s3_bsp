## Component metadata
version: "1.0.0"
description: "Unified Board Support Package for the Waveshare ESP32-S3 Touch ePaper 1.54 V2 (ESP32-S3-PICO-1-N8R8)."
url: "https://github.com/Humidyne-Labs/esp32-s3_bsp"
repository: "https://github.com/Humidyne-Labs/esp32-s3_bsp.git"
license: "MIT"
tags:
  - bsp
  - display
  - epaper
  - lvgl
  - esp32s3
  - touch
  - audio

## Target hardware restrictions
targets:
  - esp32s3

## Required dependencies
dependencies:
  idf: ">=5.1"
  lvgl/lvgl: "^9.6.0"

## File inclusion/exclusion rules (for registry packaging)
files:
  exclude:
    - ".git*"
    - "build/"
    - "docs/"
    - "*.png"
    - "examples/"
